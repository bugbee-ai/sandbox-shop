name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "sandbox-shop-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sandbox Shop $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Debug-signed APK for sideloading onto a device or emulator. A production pipeline would sign a release build here using keystore secrets stored in Actions." \
            "sandbox-shop-${GITHUB_REF_NAME}.apk"
          echo "url=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url -q .url)" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          echo "🚀 Published release **$GITHUB_REF_NAME** — ${{ steps.publish.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
